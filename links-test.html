<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้านหนุ่มดำเนิน - เมนูสั่งซื้อ</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9P4HMHGDM2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    
      gtag('config', 'G-9P4HMHGDM2');
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f0fdf4;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: #333;
            min-height: 100vh;
        }
        .profile-area {
            text-align: center;
            margin-bottom: 30px;
        }
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background-color: #fff;
            margin-bottom: 15px;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { 
            font-size: 22px; 
            margin: 0 0 8px 0; 
            font-weight: 600;
            color: #166534;
        }
        p { 
            color: #666; 
            margin: 0; 
            font-size: 15px; 
        }
        
        .links-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            background-color: white;
            border: 1px solid #e5e7eb;
            padding: 12px 16px; /* ปรับลด padding นิดหน่อยให้กระชับ */
            border-radius: 16px;
            text-decoration: none;
            color: #333;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .link-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(22, 101, 52, 0.15);
            border-color: #4ade80;
        }

        /* ส่วนของรูปโลโก้ด้านซ้าย */
        .btn-logo-wrapper {
            width: 45px;
            height: 45px;
            margin-right: 15px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            /* border: 1px solid #eee; */
        }
        
        .btn-logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* ให้ภาพพอดีกรอบ */
        }

        .btn-text {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .btn-title {
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
        }
        .btn-subtitle {
            font-size: 12px;
            color: #666;
            margin-top: 3px;
        }
        
        /* ป้ายโปรโมชั่น (Tag) */
        .promo-tag {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: normal;
            margin-left: 5px;
            display: inline-block;
        }
        .tag-red { background-color: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
        .tag-purple { background-color: #f3e8ff; color: #9333ea; border: 1px solid #e9d5ff; }

        .btn-arrow {
            color: #ccc;
            font-size: 14px;
            margin-left: 10px;
        }

        /* ดาว rating */
        .rating {
            color: #f59e0b;
            font-size: 13px;
            font-weight: normal;
            margin-left: auto; /* ดันดาวไปขวาสุดของชื่อ */
            display: flex;
            align-items: center;
            gap: 3px;
        }
        
        /* Badge มุมขวาบน */
        .badge-corner {
            position: absolute;
            top: 0;
            right: 0;
            font-size: 9px;
            padding: 3px 8px;
            border-bottom-left-radius: 8px;
            color: white;
            font-weight: bold;
        }
        .bg-green { background-color: #10b981; }
        .bg-orange { background-color: #f97316; }

    </style>
</head>
<body>

    <div class="profile-area">
        <img src="https://lh3.googleusercontent.com/d/1j9sqxnSEJcCKIVZMfc20RlRP0zCU3YU8" class="profile-img" alt="โลโก้ร้าน"> 
        <h1>หนุ่มดำเนิน มะพร้าวปั่น</h1>
        <p>หอมมะพร้าวแท้ จากมะพร้าวน้ำหอมแท้ 100%</p>
    </div>
    
    <div class="links-container">
        
        <a href="https://wongn.ai/223eD4" class="link-btn">
            <div class="badge-corner bg-green">ขายดี</div>
            <div class="btn-logo-wrapper">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6c/Line_Man_logo.svg/1024px-Line_Man_logo.svg.png" alt="LINE MAN">
            </div>
            <div class="btn-text">
                <span class="btn-title">
                    LINE MAN
                    <span class="rating"><i class="fa-solid fa-star"></i> 5.0 (619)</span>
                </span>
                <span class="btn-subtitle">ค่าส่งถูกสุด ส่งฟรี | ใส่โค้ด 'AROI'</span>
            </div>
            <i class="fa-solid fa-chevron-right btn-arrow"></i>
        </a>

        <a href="https://grab.onelink.me/..." class="link-btn">
            <div class="badge-corner bg-orange">ลด 40%</div>
            <div class="btn-logo-wrapper">
                <img src="https://seeklogo.com/images/G/grab-logo-7020E74857-seeklogo.com.png" alt="GrabFood">
            </div>
            <div class="btn-text">
                <span class="btn-title">
                    GrabFood
                    <span class="rating"><i class="fa-solid fa-star"></i> 4.9 (252)</span>
                </span>
                <span class="btn-subtitle">
                    <span class="promo-tag tag-red"><i class="fa-solid fa-tag"></i> ลด 40%</span>
                    ค่าส่งถูก
                </span>
            </div>
            <i class="fa-solid fa-chevron-right btn-arrow"></i>
        </a>

        <a href="https://static.robinhood.in.th/..." class="link-btn">
            <div class="btn-logo-wrapper">
                <img src="https://play-lh.googleusercontent.com/VS0j9CqE-YyL0s-8t8TzS7AJP0yRTEu0xX8tC6qE_Q8n_C0kC5u_O8a8h8j_F9x_0k=w240-h480-rw" style="border-radius:8px;" alt="Robinhood">
            </div>
            <div class="btn-text">
                <span class="btn-title">
                    Robinhood
                    <span class="rating"><i class="fa-solid fa-star"></i> 5.0 (20)</span>
                </span>
                <span class="btn-subtitle">
                    <span class="promo-tag tag-purple">ร้านใจดีลดเพิ่ม 5%</span>
                    ราคาหน้าร้าน
                </span>
            </div>
            <i class="fa-solid fa-chevron-right btn-arrow"></i>
        </a>

        <a href="https://lin.ee/svRu5ks" class="link-btn" style="border: 2px solid #06C755; background-color: #fcfdfc;">
            <div class="btn-logo-wrapper">
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/41/LINE_logo.svg" alt="LINE OA">
            </div>
            <div class="btn-text">
                <span class="btn-title" style="color: #06C755;">ทักแชทสั่งร้านโดยตรง</span>
                <span class="btn-subtitle">สั่ง 200.- ส่งฟรี (ระยะใกล้)</span>
            </div>
            <i class="fa-solid fa-comment-dots btn-arrow" style="color:#06C755"></i>
        </a>

    </div>

</body>
</html>
