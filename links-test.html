<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f0fdf4;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: #333;
            min-height: 100vh;
        }
        .profile-area {
            text-align: center;
            margin-bottom: 30px;
        }
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background-color: #fff;
            margin-bottom: 15px;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { 
            font-size: 22px; margin: 0 0 8px 0; font-weight: 600; color: #166534;
        }
        p { color: #666; margin: 0; font-size: 15px; }
        
        .links-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            background-color: white;
            border: 1px solid #e5e7eb;
            padding: 12px 16px;
            border-radius: 16px;
            text-decoration: none;
            color: #333;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .link-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(22, 101, 52, 0.15);
            border-color: #4ade80;
        }

        /* กรอบใส่รูปโลโก้ */
        .btn-logo-wrapper {
            width: 50px;
            height: 50px;
            margin-right: 15px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            overflow: hidden;
            background-color: #f9fafb; /* พื้นหลังจางๆ เผื่อรูปเป็นพื้นใส */
        }
        
        .btn-logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* ปรับรูปให้พอดีกรอบ */
        }

        .btn-text {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .btn-title {
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
            line-height: 1.2;
        }
        .btn-subtitle {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        /* ป้ายโปรโมชั่น (Tag) */
        .promo-tag {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: normal;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .tag-green { 
            background-color: #e8fce8; /* พื้นหลังเขียวอ่อน */
            color: #00B900;            /* สีเขียว LINE MAN */
            border: 1px solid #66d966; /* ขอบสีเขียว */
        }
        .tag-red { background-color: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
        .tag-purple { background-color: #f3e8ff; color: #9333ea; border: 1px solid #e9d5ff; }

        .btn-arrow { color: #ccc; font-size: 14px; margin-left: 10px; }
        .rating { color: #f59e0b; font-size: 13px; font-weight: normal; display: flex; align-items: center; gap: 3px; }
        
        /* Badge มุมขวาบน */
        .badge-corner {
            position: absolute;
            top: 0;
            right: 0;
            font-size: 9px;
            padding: 3px 8px;
            border-bottom-left-radius: 8px;
            color: white;
            font-weight: bold;
            z-index: 10;
        }
        .bg-green { background-color: #10b981; }
        .bg-orange { background-color: #f97316; }

    </style>
</head>
<body>
