<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant P&L (Final Fix)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        /* Fix: บังคับขนาดกราฟไม่ให้ล้น */
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
    </style>
</head>
<body class="bg-gray-100">

    <nav class="bg-blue-900 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">📊 Restaurant P&L</h1>
            <div class="space-x-2">
                <button onclick="showSection('dashboard')" class="bg-blue-800 px-3 py-1 rounded">Dashboard</button>
                <button onclick="showSection('input-sales')" class="bg-blue-800 px-3 py-1 rounded">บันทึกยอดขาย</button>
                <button onclick="showSection('input-expense')" class="bg-blue-800 px-3 py-1 rounded">บันทึกค่าใช้จ่าย</button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-6">
        <div id="loading" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
            <div class="bg-white p-4 rounded shadow-lg text-black">กำลังโหลดข้อมูล...</div>
        </div>

        <div id="dashboard" class="section-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">ภาพรวม</h2>
                <button onclick="loadDashboard()" class="text-sm text-blue-600 underline">รีเฟรช</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-white p-4 rounded shadow border-l-4 border-green-500">
                    <p class="text-gray-500 text-sm">รายได้รวม</p>
                    <h2 class="text-2xl font-bold" id="totalRevenue">0 ฿</h2>
                </div>
                <div class="bg-white p-4 rounded shadow border-l-4 border-red-500">
                    <p class="text-gray-500 text-sm">ต้นทุนขาย</p>
                    <h2 class="text-2xl font-bold" id="totalCOGS">0 ฿</h2>
                </div>
                <div class="bg-white p-4 rounded shadow border-l-4 border-yellow-500">
                    <p class="text-gray-500 text-sm">ค่าใช้จ่าย</p>
                    <h2 class="text-2xl font-bold" id="totalExpense">0 ฿</h2>
                </div>
                <div class="bg-white p-4 rounded shadow border-l-4 border-blue-500">
                    <p class="text-gray-500 text-sm">กำไรสุทธิ</p>
                    <h2 class="text-2xl font-bold" id="netProfit">0 ฿</h2>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded shadow lg:col-span-2">
                    <h3 class="text-lg font-bold mb-4">สัดส่วนกำไร/ขาดทุน</h3>
                    <div class="chart-container">
                        <canvas id="plChart"></canvas>
                    </div>
                </div>

                <div class="bg-white p-6 rounded shadow">
                    <h3 class="text-lg font-bold mb-4">รายการล่าสุด</h3>
                    <ul id="recentTransactions" class="text-sm space-y-2 max-h-64 overflow-y-auto">
                        <li class="text-gray-400 text-center">...</li>
                    </ul>
                </div>
            </div>
        </div>

        <div id="input-sales" class="section-content hidden">
            <div class="bg-white p-6 rounded shadow max-w-xl mx-auto">
                <h2 class="text-xl font-bold mb-4">บันทึกยอดขาย</h2>
                <form id="salesForm" class="space-y-3">
                    <input type="date" id="saleDate" class="w-full border p-2 rounded" required>
                    <input type="number" id="saleALaCarte" placeholder="A La Carte" class="w-full border p-2 rounded">
                    <input type="number" id="saleBuffet" placeholder="Buffet" class="w-full border p-2 rounded">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="delGrab" placeholder="Grab" class="border p-2 rounded">
                        <input type="number" id="delLineman" placeholder="Lineman" class="border p-2 rounded">
                        <input type="number" id="delRobinhood" placeholder="Robinhood" class="border p-2 rounded">
                        <input type="number" id="delOther" placeholder="อื่นๆ" class="border p-2 rounded">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded">บันทึก</button>
                </form>
            </div>
        </div>

        <div id="input-expense" class="section-content hidden">
            <div class="bg-white p-6 rounded shadow max-w-xl mx-auto">
                <h2 class="text-xl font-bold mb-4">บันทึกค่าใช้จ่าย</h2>
                <form id="expenseForm" class="space-y-3">
                    <input type="date" id="expDate" class="w-full border p-2 rounded" required>
                    <label class="block text-sm font-medium text-gray-700">หมวดหมู่บัญชี (อ้างอิง Report 📊)</label>
                    <select id="expCategory" class="w-full border p-2 rounded bg-white">
                        <option value="" disabled selected>-- เลือกรายการ --</option>
                        
                        <optgroup label="💰 ต้นทุนขาย (COGS)">
                            <option value="0201">0201 - วัตถุดิบอาหาร (Food Cost)</option>
                            <option value="0202">0202 - เครื่องดื่ม (Beverage Cost)</option>
                            <option value="0203">0203 - เครื่องดื่มแอลกอฮอล์</option>
                            <option value="0204">0204 - ขนมหวาน (Dessert)</option>
                            <option value="0205">0205 - บรรจุภัณฑ์ (Packaging)</option>
                            <option value="0207">0207 - ค่าแก๊ส (LPG)</option>
                            <option value="0208">0208 - วัสดุสิ้นเปลืองในครัว</option>
                        </optgroup>

                        <optgroup label="👷 ค่าแรง (Labor Cost)">
                            <option value="0301">0301 - เงินเดือนพนักงาน (FT)</option>
                            <option value="0302">0302 - ค่าล่วงเวลา (OT)</option>
                            <option value="0303">0303 - ค่าแรงพนักงาน (PT)</option>
                            <option value="0304">0304 - สวัสดิการ/เบี้ยขยัน</option>
                            <option value="0309">0309 - ประกันสังคม (ส่วนนายจ้าง)</option>
                        </optgroup>

                        <optgroup label="💡 ค่าใช้จ่ายดำเนินงาน (OPEX)">
                            <option value="0401">0401 - ค่าไฟฟ้า</option>
                            <option value="0402">0402 - ค่าน้ำประปา</option>
                            <option value="0403">0403 - ค่าโทรศัพท์/อินเทอร์เน็ต</option>
                            <option value="0405">0405 - อุปกรณ์เครื่องครัว (เสื่อมสภาพ)</option>
                            <option value="0406">0406 - ค่าซ่อมแซมบำรุงรักษา</option>
                            <option value="0407">0407 - ค่าเดินทาง</option>
                            <option value="0408">0408 - ค่าโฆษณา/การตลาด (Ads)</option>
                            <option value="0409">0409 - วัสดุสิ้นเปลืองหน้าร้าน</option>
                            <option value="0411">0411 - ค่าใช้จ่ายเบ็ดเตล็ด</option>
                            <option value="0416">0416 - ค่าเช่าที่</option>
                            <option value="0420">0420 - GP Delivery (Grab/Lineman)</option>
                        </optgroup>
                    </select>
                    <input type="number" id="expAmount" placeholder="จำนวนเงิน" class="w-full border p-2 rounded" required>
                    <input type="text" id="expMemo" placeholder="รายละเอียด" class="w-full border p-2 rounded">
                    <button type="submit" class="w-full bg-red-600 text-white p-2 rounded">บันทึก</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, Timestamp } 
        from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // TODO: วาง Firebase Config ของคุณตรงนี้
          const firebaseConfig = {
            apiKey: "AIzaSyDRiTZXUbkdGaCHZVTkOOl1Iu0A-744tE0",
            authDomain: "numdamnoen-6cbd5.firebaseapp.com",
            projectId: "numdamnoen-6cbd5",
            storageBucket: "numdamnoen-6cbd5.firebasestorage.app",
            messagingSenderId: "823964498524",
            appId: "1:823964498524:web:c79d742cf1a5a33c864499",
            measurementId: "G-805RS7VZEM"
          };

        // Init
        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch (e) { console.error(e); alert("ตั้งค่า Firebase ผิด: " + e.message); }

        window.showSection = (id) => {
            document.querySelectorAll('.section-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            if(id === 'dashboard') loadDashboard();
        }

        // Functions
        const getVal = (id) => Number(document.getElementById(id).value) || 0;
        const showLoading = (show) => document.getElementById('loading').className = show ? "fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50" : "hidden";

        // Save Sales
        document.getElementById('salesForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            showLoading(true);
            try {
                await addDoc(collection(db, "daily_sales"), {
                    date: document.getElementById('saleDate').value,
                    alacarte: getVal('saleALaCarte'), buffet: getVal('saleBuffet'),
                    delivery_grab: getVal('delGrab'), delivery_lineman: getVal('delLineman'),
                    delivery_robinhood: getVal('delRobinhood'), delivery_other: getVal('delOther'),
                    timestamp: Timestamp.now()
                });
                alert("✅ บันทึกยอดขายแล้ว"); e.target.reset();
            } catch (err) { alert("Error: " + err.message); }
            showLoading(false);
        });

        // Save Expense
        document.getElementById('expenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            showLoading(true);
            try {
                await addDoc(collection(db, "expenses"), {
                    date: document.getElementById('expDate').value,
                    category: document.getElementById('expCategory').value,
                    amount: getVal('expAmount'), memo: document.getElementById('expMemo').value,
                    timestamp: Timestamp.now()
                });
                alert("✅ บันทึกค่าใช้จ่ายแล้ว"); e.target.reset();
            } catch (err) { alert("Error: " + err.message); }
            showLoading(false);
        });

        // Dashboard
        window.loadDashboard = async () => {
            showLoading(true);
            try {
                let rev = 0, cogs = 0, opex = 0;
                const list = document.getElementById('recentTransactions');
                list.innerHTML = '';

                // Get Sales
                (await getDocs(collection(db, "daily_sales"))).forEach(doc => {
                    const d = doc.data();
                    rev += (d.alacarte || 0) + (d.buffet || 0) + (d.delivery_grab || 0) + (d.delivery_lineman || 0) + (d.delivery_robinhood || 0) + (d.delivery_other || 0);
                });

                // Get Expenses
                (await getDocs(collection(db, "expenses"))).forEach(doc => {
                    const d = doc.data();
                    if(['0201','0207'].includes(d.category)) cogs += d.amount;
                    else opex += d.amount;
                    
                    const li = document.createElement('li');
                    li.className = "flex justify-between border-b pb-1";
                    li.innerHTML = `<span>${d.date} ${d.memo}</span><span class="text-red-500">-${d.amount}</span>`;
                    list.prepend(li);
                });

                // Update UI
                const net = rev - cogs - opex;
                document.getElementById('totalRevenue').innerText = rev.toLocaleString() + ' ฿';
                document.getElementById('totalCOGS').innerText = cogs.toLocaleString() + ' ฿';
                document.getElementById('totalExpense').innerText = opex.toLocaleString() + ' ฿';
                document.getElementById('netProfit').innerText = net.toLocaleString() + ' ฿';

                renderChart(rev, cogs, opex);
            } catch (err) { console.error(err); }
            showLoading(false);
        }

        // Chart Fix: Destroy old chart before creating new one
        let myChart = null;
        function renderChart(rev, cogs, exp) {
            const ctx = document.getElementById('plChart');
            if(myChart) myChart.destroy();
            
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['กำไร', 'ต้นทุน', 'ค่าใช้จ่าย'],
                    datasets: [{
                        data: [Math.max(0, rev - cogs - exp), cogs, exp],
                        backgroundColor: ['#3B82F6', '#EF4444', '#F59E0B']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false // สำคัญ: ป้องกันการยืด
                }
            });
        }

        // Init Dates
        document.getElementById('saleDate').valueAsDate = new Date();
        document.getElementById('expDate').valueAsDate = new Date();
        loadDashboard();
    </script>
</body>
</html>
