<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้านหอมดำเนิน - เมนูสั่งซื้อ</title>
    <style>
        body {
            font-family: 'Kanit', sans-serif; /* ใช้ฟอนต์ Kanit ตามที่คุณชอบ */
            background-color: #f0fdf4; /* พื้นหลังสีเขียวอ่อน */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: #333;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #ddd; /* ใส่รูปโลโก้ตรงนี้ */
            margin-bottom: 15px;
            object-fit: cover;
        }
        h1 { font-size: 20px; margin-bottom: 5px; }
        p { color: #666; margin-bottom: 30px; font-size: 14px; }
        
        .link-btn {
            background-color: white;
            border: 1px solid #e5e7eb;
            width: 100%;
            max-width: 400px;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 30px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .link-btn:hover {
            transform: scale(1.02);
            border-color: #4ade80; /* สีเขียวเมื่อเอาเมาส์ชี้ */
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="profile-img"></div> <h1>หอมดำเนิน (Hom Damnoen)</h1>
    <p>หอม หวานธรรมชาติ ไม่ผสม เฉาะสดใหม่</p>

    <a href="#" class="link-btn">💚 สั่งผ่าน LINE MAN</a>
    <a href="#" class="link-btn">💚 สั่งผ่าน GrabFood</a>
    <a href="#" class="link-btn">💜 สั่งผ่าน Robinhood</a>
    <a href="#" class="link-btn">💬 ทักแชท LINE OA</a>

</body>
</html>
