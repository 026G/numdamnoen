<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เช็คราคา Lalamove - หนุ่มดำเนิน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">

        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-orange-100 rounded-full flex items-center justify-center mx-auto mb-3">
                <img src="https://cdn-icons-png.flaticon.com/512/273/273177.png" class="w-10 h-10">
            </div>
            <h1 class="text-2xl font-bold text-gray-800">เช็คค่าส่ง Lalamove</h1>
            <p class="text-gray-500 text-sm">สำหรับร้านหนุ่มดำเนิน (Sandbox Mode)</p>
        </div>

        <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 mb-4 fade-in">
            <h3 class="text-blue-800 text-xs font-bold mb-2 uppercase tracking-wide"><i class="fa-solid fa-address-card mr-1"></i> ข้อมูลลูกค้า</h3>
            
            <div class="flex justify-between items-center mb-1 border-b border-blue-100 pb-1">
                <span class="text-gray-500 text-xs">Order ID:</span>
                <span id="showOrderId" class="font-mono font-bold text-blue-600 text-sm">-</span>
            </div>
            
            <div class="flex justify-between items-center mb-1">
                <span class="text-gray-500 text-xs">ชื่อ:</span>
                <span id="showName" class="font-bold text-gray-700 text-sm">-</span>
            </div>
            
            <div class="flex justify-between items-center">
                <span class="text-gray-500 text-xs">โทร:</span>
                <span id="showPhone" class="font-bold text-gray-700 text-sm">-</span>
            </div>
        </div>
        <div class="space-y-4">

            <div class="bg-orange-50 p-4 rounded-xl border border-orange-100">
                <label class="block text-orange-800 text-xs font-bold mb-1">📍 ต้นทาง (ร้านหนุ่มดำเนิน)</label>
                <div class="flex gap-2 mb-2">
                    <input type="text" id="originLat" class="w-1/2 text-xs bg-white border border-orange-200 rounded px-2 py-1 text-gray-500" value="13.639417" readonly>
                    <input type="text" id="originLng" class="w-1/2 text-xs bg-white border border-orange-200 rounded px-2 py-1 text-gray-500" value="100.499580" readonly>
                </div>
            </div>

            <div class="bg-green-50 p-4 rounded-xl border border-green-100 relative">
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-green-800 text-xs font-bold">🏁 ปลายทาง (ลูกค้า)</label>
                    <span class="text-[10px] bg-green-200 text-green-800 px-2 py-0.5 rounded-full font-bold">Auto Fill</span>
                </div>

                <textarea id="destAddress" rows="2" class="w-full text-sm bg-white border border-green-200 rounded-lg px-3 py-2 text-gray-700 mb-2 focus:outline-none focus:ring-1 focus:ring-green-500" placeholder="ระบุบ้านเลขที่/หมู่บ้าน (ภาษาไทย)"></textarea>

                <input type="text" id="destNote" class="w-full text-sm bg-white border border-green-200 rounded-lg px-3 py-2 text-gray-700 mb-2 focus:outline-none focus:ring-1 focus:ring-green-500" placeholder="📝 จุดสังเกต (เช่น รั้วสีขาว, ฝากป้อมยาม)">

                <div class="flex gap-2">
                    <input type="text" id="destLat" placeholder="Latitude" class="w-1/2 text-xs bg-white border border-green-200 rounded px-2 py-1 text-gray-600 font-mono">
                    <input type="text" id="destLng" placeholder="Longitude" class="w-1/2 text-xs bg-white border border-green-200 rounded px-2 py-1 text-gray-600 font-mono">
                </div>
            </div>

            <button onclick="checkPrice()" id="checkBtn" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3.5 rounded-xl transition duration-200 shadow-lg flex justify-center items-center gap-2 text-lg mt-2">
                <span>🔍 ตรวจสอบราคา</span>
            </button>
        </div>

        <div id="resultArea" class="hidden mt-4 p-4 bg-gray-50 rounded-lg border border-gray-200 fade-in">
            <div class="text-center">
                <p class="text-gray-500 text-sm">ค่าส่งสุทธิ</p>
                <h2 id="priceDisplay" class="text-4xl font-bold text-gray-800 my-2">฿0</h2>
            </div>

            <a id="openLalamoveApp" href="#" target="_blank" class="block w-full mt-3 text-center text-orange-600 border border-orange-600 font-bold py-2 px-4 rounded-lg hover:bg-orange-50 transition">
                📱 เปิดแอป Lalamove
            </a>

            <button id="btnOrder" onclick="placeOrder()" class="hidden w-full mt-3 bg-green-600 text-white font-bold py-3 px-4 rounded-lg shadow hover:bg-green-700 transition duration-300 flex items-center justify-center gap-2">
                🚀 เรียกไรเดอร์ (Sandbox Test)
            </button>
        </div>

    </div>

    <script>
        // 🔴🔴🔴 URL Google Apps Script (ต้องตรงกับที่ Deploy ล่าสุด) 🔴🔴🔴
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycby-CN2vDIOsauP7k1qjiGEm3nPlNV0X9ADKyt_Xzzw1HUY_fzobRJZnTapRUweWu9a3fg/exec";

        let currentQuotationId = "";
        let currentStopInfo = {};
        let customerName = "";
        let customerPhone = "";
        let orderId = ""; 
        let secretCode = ""; // 🔥 ตัวแปรเก็บรหัสลับ

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        window.onload = function() {
            const lat = getQueryParam('lat');
            const lng = getQueryParam('lng');
            const addr = getQueryParam('addr');
            const note = getQueryParam('note'); 
            
            customerName = decodeURIComponent(getQueryParam('name') || "-");
            customerPhone = decodeURIComponent(getQueryParam('phone') || "-");
            orderId = decodeURIComponent(getQueryParam('orderId') || "-");
            // 🔥 รับค่า secret จาก URL อัตโนมัติ
            secretCode = decodeURIComponent(getQueryParam('secret') || "");

            document.getElementById('showOrderId').innerText = orderId;
            document.getElementById('showName').innerText = customerName;
            document.getElementById('showPhone').innerText = customerPhone;

            if (lat && lng) {
                document.getElementById('destLat').value = lat;
                document.getElementById('destLng').value = lng;
                if (addr) document.getElementById('destAddress').value = decodeURIComponent(addr);
                if (note) document.getElementById('destNote').value = decodeURIComponent(note);
                
                setTimeout(() => {
                    const btn = document.getElementById('checkBtn');
                    if(btn) btn.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 500);
            } else {
                console.log("Test Mode");
                document.getElementById('destLat').value = "13.746246"; 
                document.getElementById('destLng').value = "100.539845";
                document.getElementById('destAddress').value = "📍 จุดทดสอบ (Central World)";
                document.getElementById('destNote').value = "รอหน้าประตูทางเข้า ฝั่งพระพิฆเนศ"; 
            }
        };

        function checkPrice() {
            const btn = document.getElementById('checkBtn');
            const resultArea = document.getElementById('resultArea');
            const priceDisplay = document.getElementById('priceDisplay');
            const btnOrder = document.getElementById('btnOrder');

            const originLat = document.getElementById('originLat').value;
            const originLng = document.getElementById('originLng').value;
            const destLat = document.getElementById('destLat').value;
            const destLng = document.getElementById('destLng').value;
            const destAddrInput = document.getElementById('destAddress').value;
            const finalDestAddr = destAddrInput.trim() !== "" ? destAddrInput : "Customer Location";
            const destNoteInput = document.getElementById('destNote').value || "";

            if (!originLat || !originLng || !destLat || !destLng) {
                alert("❌ กรุณาระบุพิกัดต้นทางและปลายทางให้ครบถ้วน");
                return;
            }

            let formattedPhone = "+66800000000"; 
            if (customerPhone && customerPhone !== "-") {
                let cleanPhone = customerPhone.replace(/\D/g, ''); 
                if (cleanPhone.startsWith('0')) {
                    formattedPhone = '+66' + cleanPhone.substring(1); 
                } else if (cleanPhone.startsWith('66')) {
                    formattedPhone = '+' + cleanPhone;
                } else {
                     formattedPhone = '+66' + cleanPhone;
                }
            }

            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> กำลังคำนวณ...';
            btn.disabled = true;
            btn.classList.add('opacity-70');
            
            if(resultArea) resultArea.classList.add('hidden');
            if(btnOrder) btnOrder.classList.add('hidden');

            fetch(GAS_API_URL, {
                method: 'POST',
                redirect: 'follow',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'check_price', 
                    secret: secretCode, // 🔥 ส่งรหัสลับไปด้วย
                    originLat: originLat,
                    originLng: originLng,
                    destLat: destLat,
                    destLng: destLng,
                    destAddr: finalDestAddr 
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log("Check Price Result:", data);

                if (data.error) {
                    alert("⚠️ เกิดข้อผิดพลาด: " + data.error);
                } else if (data.data) {
                    const stops = data.data.stops; 
                    const price = data.data.priceBreakdown.total;
                    if(priceDisplay) priceDisplay.innerHTML = `฿${price}`;
                    if(resultArea) resultArea.classList.remove('hidden');

                    currentQuotationId = data.data.quotationId; 
                    
                    currentStopInfo = {
                        pickup: { 
                            stopId: stops[0].stopId,
                            name: "Shop Numdamnoen", 
                            phone: "+66812345678"
                        },
                        drop: { 
                            stopId: stops[1].stopId,
                            name: (customerName && customerName !== "-") ? customerName : "Customer", 
                            phone: formattedPhone, 
                            remarks: destNoteInput 
                        }
                    };

                    if(btnOrder) btnOrder.classList.remove('hidden');
                    const btnApp = document.getElementById('openLalamoveApp');
                    if(btnApp) btnApp.href = "https://lalamove.app.link/"; 

                } else {
                    alert("⚠️ Lalamove ตอบกลับผิดปกติ: " + JSON.stringify(data));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("❌ เชื่อมต่อ Server ไม่ได้");
            })
            .finally(() => {
                btn.innerHTML = '<span>🔍 ตรวจสอบราคา</span>';
                btn.disabled = false;
                btn.classList.remove('opacity-70');
            });
        }

        function placeOrder() {
            if (!currentQuotationId) {
                alert("❌ ไม่พบข้อมูลราคา กรุณากดตรวจสอบราคาใหม่");
                return;
            }
            
            const btn = document.getElementById('btnOrder');
            const originalText = btn.innerHTML;
            
            if(!confirm("ยืนยันการเรียกรถ (Sandbox Mode)?\nระบบจะจำลองการเรียกรถแต่ไม่มีรถจริงมารับ")) return;

            const latestNote = document.getElementById('destNote').value || "";
            if (currentStopInfo.drop) currentStopInfo.drop.remarks = latestNote;

            btn.innerHTML = "⏳ กำลังเรียกไรเดอร์...";
            btn.disabled = true;

            fetch(GAS_API_URL, {
                method: 'POST',
                redirect: 'follow',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'create_order',  
                    secret: secretCode, // 🔥 ส่งรหัสลับไปด้วย
                    quotationId: currentQuotationId,
                    stops: currentStopInfo 
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log("Place Order Result:", data);

                if (data.data && data.data.orderId) {
                    alert(`🎉 เรียกรถสำเร็จ!\nOrder ID: ${data.data.orderId}\n(เช็คสถานะในเว็บ Lalamove Partner)`);
                    btn.innerHTML = "✅ เรียกรถแล้ว";
                    btn.classList.remove('bg-green-600', 'hover:bg-green-700');
                    btn.classList.add('bg-gray-400', 'cursor-not-allowed');
                } else {
                    alert("⚠️ เรียกรถไม่สำเร็จ: " + (data.message || JSON.stringify(data)));
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("❌ เชื่อมต่อ Server ไม่ได้");
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        }

        window.checkLalamovePrice = checkPrice;
    </script>
</body>
</html>
