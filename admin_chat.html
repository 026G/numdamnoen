<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Chat Helper</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-4">
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow p-4 space-y-3">
    <h1 class="text-lg font-bold">💬 ทักลูกค้า (ช่วยแอดมิน)</h1>

    <div id="info" class="text-sm text-gray-700"></div>

    <textarea id="msg" class="w-full border rounded-xl p-3 bg-gray-50" rows="5"></textarea>

    <div class="grid grid-cols-2 gap-2">
      <button id="copy" class="bg-green-600 text-white rounded-xl py-3 font-bold">คัดลอกข้อความ</button>
      <a id="sms" class="bg-blue-600 text-white rounded-xl py-3 font-bold text-center">ส่ง SMS</a>
    </div>

    <!-- ปุ่มเปิดแชท LINE OA (แชทกับ OA) -->
    <a id="oa" class="block bg-gray-900 text-white rounded-xl py-3 font-bold text-center">
      เปิดแชท LINE OA
    </a>

    <p class="text-xs text-gray-500">
      * ถ้าต้องการ “ทักใน LINE OA ไปหาลูกค้า” แบบส่งเข้าลูกค้าเลย ต้องใช้แบบ B (LIFF + userId)
    </p>
  </div>

<script>
  const qs = new URLSearchParams(location.search);
  const orderId = qs.get("orderId") || "-";
  const phone = (qs.get("phone") || "").replace(/-/g,"");
  const name = qs.get("name") || "ลูกค้า";
  const total = qs.get("total") || "-";

  document.getElementById("info").innerHTML =
    `ออเดอร์ <b>#${orderId}</b><br>ลูกค้า: <b>${name}</b> (${phone})<br>ยอด: <b>${total}</b>`;

  const text =
`สวัสดีครับคุณ${name} 😊
ออเดอร์ #${orderId} ทางร้านกำลังสรุปยอดให้ครับ
สะดวกให้ส่ง QR ทางแชทนี้ได้เลยนะครับ`;

  const msg = document.getElementById("msg");
  msg.value = text;

  document.getElementById("copy").onclick = async () => {
    await navigator.clipboard.writeText(msg.value);
    alert("คัดลอกแล้ว");
  };

  document.getElementById("sms").href = `sms:${phone}?&body=${encodeURIComponent(text)}`;

  // เปิดแชทกับ OA (เปลี่ยน @YOUR_OA_ID ให้เป็นไอดี OA ของคุณ)
  document.getElementById("oa").href =
    `https://line.me/R/ti/p/@YOUR_OA_ID`;
</script>
</body>
</html>
