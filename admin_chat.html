<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Chat Helper</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="referrer" content="no-referrer" />
</head>

<body class="bg-gray-50 p-4">
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow p-4 space-y-3">
    <h1 class="text-lg font-bold">💬 ข้อความทักลูกค้า (คัดลอกส่ง)</h1>

    <div id="info" class="text-sm text-gray-700 bg-gray-50 border border-gray-100 rounded-xl p-3"></div>

    <label class="text-xs font-bold text-gray-600">ข้อความพร้อมส่ง</label>
    <textarea id="msg" class="w-full border rounded-xl p-3 bg-gray-50" rows="7"></textarea>

    <button id="copy" class="w-full bg-green-600 text-white rounded-xl py-3 font-bold">
      คัดลอกข้อความ
    </button>

    <p id="hint" class="text-xs text-gray-400"></p>
  </div>

<script>
  const qs = new URLSearchParams(location.search);
  const orderId = (qs.get("orderId") || "-").trim();
  const phone = (qs.get("phone") || "").replace(/-/g,"").trim();
  const name  = (qs.get("name")  || "ลูกค้า").trim();
  const total = (qs.get("total") || "-").trim();

  document.getElementById("info").innerHTML =
    `ออเดอร์ <b>#${orderId}</b><br>` +
    `ลูกค้า: <b>${name}</b> ${phone ? `(${phone})` : ""}<br>` +
    `ยอดรวม: <b>${total}</b>`;

  const text =
`สวัสดีครับ คุณ${name} 😊
ออเดอร์ #${orderId} ยอดรวม ${total} ครับ

เดี๋ยวแอดมินจะส่ง QR ให้ทางแชทนี้นะครับ
พอสแกนแล้ว รบกวนส่งสลิปกลับมาให้ด้วยครับ 🙏`;

  const msg = document.getElementById("msg");
  msg.value = text;

  async function copyText(t) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(t);
        return true;
      }
    } catch (e) {}

    try {
      const ta = document.createElement("textarea");
      ta.value = t;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      return false;
    }
  }

  document.getElementById("copy").onclick = async () => {
    const ok = await copyText(msg.value);
    document.getElementById("hint").textContent = ok ? "✅ คัดลอกแล้ว" : "❌ คัดลอกไม่สำเร็จ ลองคัดลอกจากกล่องข้อความ";
    alert(ok ? "คัดลอกแล้ว" : "คัดลอกไม่สำเร็จ");
  };
</script>
</body>
</html>
