<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หนุ่มดำเนิน - กราฟเส้น</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 20px; color: #333; min-height: 100vh; margin: 0; }
        .container { width: 100%; max-width: 420px; }

        /* Header */
        .header { text-align: center; margin-bottom: 20px; }
        .brand-logo { width: 60px; height: 60px; border-radius: 50%; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* Display Card */
        .display-card {
            background: white; border-radius: 20px; padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px;
            text-align: center; border: 1px solid #e2e8f0; position: relative;
        }
        .selected-date { font-size: 13px; color: #888; font-weight: 400; margin-bottom: 5px; }
        .selected-brix { font-size: 52px; font-weight: 800; color: #166534; line-height: 1; }
        .selected-status { font-size: 16px; font-weight: 600; color: #16a34a; margin-top: 5px; }
        .unit-label { font-size: 12px; color: #aaa; font-weight: 400; }

        /* --- GRAPH WRAPPER (ตัวคลุม) --- */
        .chart-wrapper-outer {
            position: relative; /* เพื่อให้วางแกน Y ทับได้ */
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            padding: 20px 0;
            overflow: hidden; /* บังส่วนเกิน */
        }

        /* พื้นที่กราฟเลื่อนได้ */
        .graph-scroll-area {
            width: 100%;
            overflow-x: auto;
            padding-right: 40px; /* เว้นที่ด้านขวาให้ตัวเลขแกน Y */
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }
        .graph-scroll-area::-webkit-scrollbar { display: none; }

        svg { display: block; height: 180px; overflow: visible; }

        /* เส้นและจุด */
        .line-path { fill: none; stroke: #16a34a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        .area-path { fill: url(#gradient); stroke: none; opacity: 0.3; }
        
        .dot { fill: white; stroke: #16a34a; stroke-width: 2; cursor: pointer; transition: all 0.2s; }
        .dot.active { fill: #16a34a; stroke: #bbf7d0; stroke-width: 4; r: 6; }
        
        .date-label { font-size: 10px; fill: #94a3b8; text-anchor: middle; }
        .date-label.active { fill: #166534; font-weight: bold; }

        /* Cursor & Grid */
        .cursor-line { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 4; opacity: 0; }
        .cursor-line.show { opacity: 1; }
        
        /* Horizontal Grid Line (เส้นบรรทัดแนวนอน) */
        .h-grid-line { stroke: #f1f5f9; stroke-width: 1; }

        /* --- FIXED RIGHT AXIS (แกน Y ด้านขวา) --- */
        .y-axis-overlay {
            position: absolute;
            top: 20px; /* ตรงกับ padding ของกราฟ */
            bottom: 20px;
            right: 0;
            width: 35px; /* ความกว้างแถบตัวเลข */
            background: linear-gradient(to left, rgba(255,255,255,1) 60%, rgba(255,255,255,0)); /* ไล่สีให้ตัวเลขชัด */
            pointer-events: none; /* กดทะลุได้ */
            z-index: 10;
        }

        .y-label {
            position: absolute;
            right: 8px;
            font-size: 10px;
            font-weight: 600;
            color: #94a3b8;
            transform: translateY(-50%); /* จัดกึ่งกลางแนวตั้ง */
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="https://lh3.googleusercontent.com/d/1j9sqxnSEJcCKIVZMfc20RlRP0zCU3YU8" class="brand-logo" alt="Logo">
            <h3 style="margin:5px 0; color:#166534;">Trend ความหวาน</h3>
            <div style="font-size:12px; color:#64748b;">ย้อนหลัง 30 วัน (เลื่อนซ้าย-ขวา)</div>
        </div>

        <div class="display-card">
            <div class="selected-date" id="show-date">--/--/--</div>
            <div class="selected-brix" id="show-brix">0.0</div>
            <div class="unit-label">ค่าความหวาน (Brix)</div>
            <div class="selected-status" id="show-status">...</div>
        </div>

        <div class="chart-wrapper-outer">
            
            <div class="y-axis-overlay" id="y-axis-container">
                </div>

            <div class="graph-scroll-area" id="scroll-area">
                <svg id="chart-svg">
                    <defs>
                        <linearGradient id="gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#22c55e" />
                            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                        </linearGradient>
                    </defs>
                    
                    <g id="grid-layer"></g> <path id="area-layer" class="area-path"></path>
                    <path id="line-layer" class="line-path"></path>
                    <line id="cursor-line" class="cursor-line" y1="0" y2="180"></line>
                    <g id="dots-layer"></g>
                    <g id="labels-layer"></g>
                </svg>
            </div>
        </div>
        
        <div style="text-align:center; font-size:11px; color:#94a3b8; margin-top:10px;">
            <i class="fa-solid fa-chart-line"></i> แตะที่จุดเพื่อดูข้อมูลละเอียด
        </div>
    </div>

    <script>
        // Mock DB
        const db = {
            '2026-01-22': 7.5, '2026-01-20': 7.1, '2026-01-19': 6.8,
            '2026-01-17': 8.2, '2026-01-14': 7.9, '2026-01-10': 6.5
        };
        const toKey = (d) => d.toISOString().split('T')[0];

        function getDataRecursive(targetDate) {
            let d = new Date(targetDate);
            let steps = 0;
            while(steps < 10) { 
                let k = toKey(d);
                if(db[k] !== undefined) return { val: db[k] };
                d.setDate(d.getDate() - 1);
                steps++;
            }
            return { val: 7.0 };
        }

        // --- Chart Config ---
        const CHART_HEIGHT = 150;
        const TOP_PADDING = 20;
        const STEP_X = 50;
        const MIN_BRIX = 6.0;
        const MAX_BRIX = 9.0;

        // ฟังก์ชันแปลงค่า Brix เป็นตำแหน่ง Y
        function mapY(val) {
            let percent = (val - MIN_BRIX) / (MAX_BRIX - MIN_BRIX);
            if(percent < 0) percent = 0;
            if(percent > 1) percent = 1;
            return CHART_HEIGHT - (percent * CHART_HEIGHT) + TOP_PADDING;
        }

        function initChart() {
            const daysToShow = 30;
            const today = new Date();
            let points = [];

            // 1. Prepare Data
            for(let i = 0; i < daysToShow; i++) {
                let d = new Date(today);
                d.setDate(d.getDate() - i);
                let data = getDataRecursive(d);
                points.push({ date: d, val: data.val });
            }
            points.reverse();

            // 2. Setup SVG Width
            // เผื่อที่ด้านซ้าย 30px และด้านขวาเยอะหน่อย (40px) ให้เส้นไม่ชนขอบ
            const totalWidth = (daysToShow * STEP_X) + 60; 
            const svg = document.getElementById('chart-svg');
            svg.setAttribute('width', totalWidth);

            // 3. Draw Axis & Grid (ส่วนเพิ่มเติม)
            const yAxisContainer = document.getElementById('y-axis-container');
            const gridLayer = document.getElementById('grid-layer');
            
            // วาดเส้นบรรทัดที่ระดับ 6.0, 7.0, 8.0, 9.0
            [6.0, 7.0, 8.0, 9.0].forEach(level => {
                const yPos = mapY(level);

                // A. ใส่ตัวเลขทางขวา (HTML)
                const label = document.createElement('div');
                label.className = 'y-label';
                label.innerText = level.toFixed(1);
                label.style.top = yPos + 'px';
                yAxisContainer.appendChild(label);

                // B. วาดเส้นแนวนอนยาวตลอดกราฟ (SVG)
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", 0);
                line.setAttribute("y1", yPos);
                line.setAttribute("x2", totalWidth); // ลากยาวสุดกราฟ
                line.setAttribute("y2", yPos);
                line.setAttribute("class", "h-grid-line");
                gridLayer.appendChild(line);
            });

            // 4. Draw Graph Line & Dots
            let lineD = "M";
            let areaD = "";
            
            points.forEach((pt, index) => {
                const x = (index * STEP_X) + 30;
                const y = mapY(pt.val);
                
                if (index === 0) {
                    lineD += `${x},${y}`;
                    areaD += `M${x},${CHART_HEIGHT + TOP_PADDING} L${x},${y}`;
                } else {
                    lineD += ` L${x},${y}`;
                    areaD += ` L${x},${y}`;
                }
                if (index === points.length - 1) {
                    areaD += ` L${x},${CHART_HEIGHT + TOP_PADDING} Z`;
                }

                // Dot
                const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                dot.setAttribute("cx", x); dot.setAttribute("cy", y);
                dot.setAttribute("r", 4); dot.setAttribute("class", "dot");
                dot.setAttribute("data-index", index);
                dot.addEventListener('click', () => { selectPoint(index, pt, x); });
                document.getElementById('dots-layer').appendChild(dot);

                // Date Label
                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", x); text.setAttribute("y", 195);
                text.setAttribute("class", "date-label");
                text.textContent = pt.date.toLocaleDateString('th-TH', { day: 'numeric' });
                text.setAttribute("data-index", index);
                document.getElementById('labels-layer').appendChild(text);
            });

            document.getElementById('line-layer').setAttribute('d', lineD);
            document.getElementById('area-layer').setAttribute('d', areaD);

            // Auto Select & Scroll
            const lastIndex = points.length - 1;
            const lastX = (lastIndex * STEP_X) + 30;
            selectPoint(lastIndex, points[lastIndex], lastX);

            setTimeout(() => {
                const scrollArea = document.getElementById('scroll-area');
                scrollArea.scrollLeft = scrollArea.scrollWidth;
            }, 100);
        }

        function selectPoint(index, data, xPos) {
            document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
            document.querySelectorAll('.date-label').forEach(t => t.classList.remove('active'));
            
            const activeDot = document.querySelector(`.dot[data-index="${index}"]`);
            const activeText = document.querySelector(`.date-label[data-index="${index}"]`);
            if(activeDot) activeDot.classList.add('active');
            if(activeText) activeText.classList.add('active');

            const cursor = document.getElementById('cursor-line');
            cursor.setAttribute('x1', xPos); cursor.setAttribute('x2', xPos);
            cursor.classList.add('show');

            const dateStr = data.date.toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: '2-digit' });
            document.getElementById('show-date').innerText = "ประจำวันที่ " + dateStr;
            document.getElementById('show-brix').innerText = data.val.toFixed(1);

            let status = "", color = "";
            if(data.val <= 6.9) { status = "หวานน้อย (สดชื่น)"; color = "#16a34a"; }
            else if(data.val <= 7.5) { status = "หวานกลาง (กำลังดี)"; color = "#ca8a04"; }
            else if(data.val <= 8.0) { status = "หวานมาก (หอม)"; color = "#ea580c"; }
            else { status = "หวานสุด (ฉ่ำ)"; color = "#dc2626"; }
            
            const statusEl = document.getElementById('show-status');
            statusEl.innerText = status;
            statusEl.style.color = color;
        }

        initChart();
    </script>
</body>
</html>
