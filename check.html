<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หนุ่มดำเนิน - กราฟเส้น</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 20px; color: #333; min-height: 100vh; margin: 0; }
        .container { width: 100%; max-width: 420px; }

        /* Header */
        .header { text-align: center; margin-bottom: 20px; }
        .brand-logo { width: 60px; height: 60px; border-radius: 50%; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* 1. Display Card (ส่วนแสดงผลข้างบน) */
        .display-card {
            background: white; border-radius: 20px; padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px;
            text-align: center; border: 1px solid #e2e8f0; position: relative;
        }
        .selected-date { font-size: 13px; color: #888; font-weight: 400; margin-bottom: 5px; }
        .selected-brix { font-size: 52px; font-weight: 800; color: #166534; line-height: 1; }
        .selected-status { font-size: 16px; font-weight: 600; color: #16a34a; margin-top: 5px; }
        .unit-label { font-size: 12px; color: #aaa; font-weight: 400; }

        /* 2. Graph Container (พื้นที่เลื่อน) */
        .graph-window {
            width: 100%;
            overflow-x: auto; /* เลื่อนแนวนอน */
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            padding: 20px 0;
            position: relative;
            
            /* ซ่อน Scrollbar */
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }
        .graph-window::-webkit-scrollbar { display: none; }

        /* ตัว SVG ที่ใช้วาดเส้น */
        svg {
            display: block;
            height: 180px; /* ความสูงกราฟ */
            overflow: visible; /* ให้จุดเด้งออกมานอกกรอบได้ */
        }

        /* Styling เส้นและจุด */
        .line-path {
            fill: none;
            stroke: #16a34a; /* สีเส้นเขียว */
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .area-path {
            fill: url(#gradient); /* สีจางๆ ใต้เส้น */
            stroke: none;
            opacity: 0.3;
        }
        
        .dot {
            fill: white;
            stroke: #16a34a;
            stroke-width: 2;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        /* จุดที่ถูกเลือก */
        .dot.active {
            fill: #16a34a;
            stroke: #bbf7d0; /* ขอบเขียวอ่อน */
            stroke-width: 4;
            r: 6; /* ขยายขนาด */
        }
        
        /* เส้นแกน X แนวนอน */
        .grid-line {
            stroke: #f1f5f9;
            stroke-width: 1;
        }

        .date-label {
            font-size: 10px;
            fill: #94a3b8;
            text-anchor: middle;
        }
        .date-label.active {
            fill: #166534;
            font-weight: bold;
        }

        /* เส้นแนวตั้งเวลาเลือก (Cursor Line) */
        .cursor-line {
            stroke: #cbd5e1;
            stroke-width: 1;
            stroke-dasharray: 4;
            opacity: 0; /* ซ่อนก่อน */
            transition: opacity 0.2s;
        }
        .cursor-line.show { opacity: 1; }

    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="https://lh3.googleusercontent.com/d/1j9sqxnSEJcCKIVZMfc20RlRP0zCU3YU8" class="brand-logo" alt="Logo">
            <h3 style="margin:5px 0; color:#166534;">Trend ความหวาน</h3>
            <div style="font-size:12px; color:#64748b;">ย้อนหลัง 30 วัน (เลื่อนซ้าย-ขวา)</div>
        </div>

        <div class="display-card">
            <div class="selected-date" id="show-date">--/--/--</div>
            <div class="selected-brix" id="show-brix">0.0</div>
            <div class="unit-label">ค่าความหวาน (Brix)</div>
            <div class="selected-status" id="show-status">...</div>
        </div>

        <div class="graph-window" id="scroll-area">
            <svg id="chart-svg">
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#22c55e" /> <stop offset="100%" stop-color="#ffffff" stop-opacity="0" /> </linearGradient>
                </defs>
                
                <g id="grid-layer"></g> <path id="area-layer" class="area-path"></path> <path id="line-layer" class="line-path"></path> <line id="cursor-line" class="cursor-line" y1="0" y2="180"></line> <g id="dots-layer"></g> <g id="labels-layer"></g> </svg>
        </div>
        
        <div style="text-align:center; font-size:11px; color:#94a3b8; margin-top:10px;">
            <i class="fa-solid fa-chart-line"></i> แตะที่จุดเพื่อดูข้อมูลละเอียด
        </div>
    </div>

    <script>
        // --- 1. Mock Database (เหมือนเดิม) ---
        const db = {
            '2026-01-22': 7.5, // วันนี้
            '2026-01-20': 7.1,
            '2026-01-19': 6.8,
            '2026-01-17': 8.2,
            '2026-01-14': 7.9,
            '2026-01-10': 6.5
        };

        const toKey = (d) => d.toISOString().split('T')[0];

        // Fallback Logic
        function getDataRecursive(targetDate) {
            let d = new Date(targetDate);
            let steps = 0;
            while(steps < 10) { 
                let k = toKey(d);
                if(db[k] !== undefined) return { val: db[k] };
                d.setDate(d.getDate() - 1);
                steps++;
            }
            return { val: 7.0 }; // Default
        }

        // --- 2. Chart Settings ---
        const CHART_HEIGHT = 150; // ความสูงกราฟ
        const TOP_PADDING = 20;   // เว้นที่ด้านบน
        const STEP_X = 50;        // ระยะห่างระหว่างวัน (แนวนอน)
        const MIN_BRIX = 6.0;     // ค่าต่ำสุดในกราฟ (Base Line)
        const MAX_BRIX = 9.0;     // ค่าสูงสุด

        function mapY(val) {
            // แปลงค่า Brix เป็นพิกัด Y (กลับด้าน เพราะ SVG 0 อยู่บน)
            // สูตร: Height - ((val - min) / (max - min) * Height)
            let percent = (val - MIN_BRIX) / (MAX_BRIX - MIN_BRIX);
            if(percent < 0) percent = 0;
            if(percent > 1) percent = 1;
            return CHART_HEIGHT - (percent * CHART_HEIGHT) + TOP_PADDING;
        }

        // --- 3. Draw Chart Function ---
        function initChart() {
            const daysToShow = 30;
            const today = new Date();
            let points = [];

            // เตรียมข้อมูล 30 วัน (เรียง อดีต -> ปัจจุบัน)
            for(let i = 0; i < daysToShow; i++) {
                let d = new Date(today);
                d.setDate(d.getDate() - i);
                let data = getDataRecursive(d);
                points.push({ date: d, val: data.val });
            }
            points.reverse();

            // ตั้งค่าความกว้าง SVG
            const totalWidth = (daysToShow * STEP_X) + 20; // เผื่อขอบขวา
            const svg = document.getElementById('chart-svg');
            svg.setAttribute('width', totalWidth);

            // ตัวแปรเก็บ Path String
            let lineD = "M"; // Start command
            let areaD = "";  // Area path
            
            // Loop สร้างจุดและเส้น
            points.forEach((pt, index) => {
                const x = (index * STEP_X) + 30; // เริ่มที่ x=30
                const y = mapY(pt.val);
                
                // 1. สร้าง Path เส้นกราฟ
                if (index === 0) {
                    lineD += `${x},${y}`;
                    areaD += `M${x},${CHART_HEIGHT + TOP_PADDING} L${x},${y}`; // Start area bottom
                } else {
                    lineD += ` L${x},${y}`;
                    areaD += ` L${x},${y}`;
                }

                // ปิดท้าย Area Path (ถ้าเป็นจุดสุดท้าย)
                if (index === points.length - 1) {
                    areaD += ` L${x},${CHART_HEIGHT + TOP_PADDING} Z`;
                }

                // 2. สร้างจุด (Dot)
                const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                dot.setAttribute("cx", x);
                dot.setAttribute("cy", y);
                dot.setAttribute("r", 4);
                dot.setAttribute("class", "dot");
                dot.setAttribute("data-index", index);
                
                // Event Click Dot
                dot.addEventListener('click', () => {
                    selectPoint(index, pt, x);
                });
                document.getElementById('dots-layer').appendChild(dot);

                // 3. สร้าง Label วันที่ด้านล่าง
                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                const dayStr = pt.date.toLocaleDateString('th-TH', { day: 'numeric' });
                text.setAttribute("x", x);
                text.setAttribute("y", 195); // อยู่ล่างสุด
                text.setAttribute("class", "date-label");
                text.textContent = dayStr;
                text.setAttribute("data-index", index);
                document.getElementById('labels-layer').appendChild(text);

                // 4. สร้างเส้น Grid แนวนอน (Grid) เฉพาะจุด
                 const grid = document.createElementNS("http://www.w3.org/2000/svg", "line");
                 grid.setAttribute("x1", x); grid.setAttribute("y1", TOP_PADDING);
                 grid.setAttribute("x2", x); grid.setAttribute("y2", 180);
                 grid.setAttribute("class", "grid-line");
                 grid.setAttribute("stroke-dasharray", "2");
                 document.getElementById('grid-layer').prepend(grid); // ไว้หลังสุด
            });

            // Apply Path to Elements
            document.getElementById('line-layer').setAttribute('d', lineD);
            document.getElementById('area-layer').setAttribute('d', areaD);

            // Auto Select Today (Last Point)
            const lastIndex = points.length - 1;
            const lastX = (lastIndex * STEP_X) + 30;
            selectPoint(lastIndex, points[lastIndex], lastX);

            // Auto Scroll to Right
            setTimeout(() => {
                const scrollArea = document.getElementById('scroll-area');
                scrollArea.scrollLeft = scrollArea.scrollWidth;
            }, 100);
        }

        // --- 4. Update Display ---
        function selectPoint(index, data, xPos) {
            // Update Active Classes
            document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
            document.querySelectorAll('.date-label').forEach(t => t.classList.remove('active'));
            
            const activeDot = document.querySelector(`.dot[data-index="${index}"]`);
            const activeText = document.querySelector(`.date-label[data-index="${index}"]`);
            
            if(activeDot) activeDot.classList.add('active');
            if(activeText) activeText.classList.add('active');

            // Move Cursor Line
            const cursor = document.getElementById('cursor-line');
            cursor.setAttribute('x1', xPos);
            cursor.setAttribute('x2', xPos);
            cursor.classList.add('show');

            // Update Card Info
            const dateStr = data.date.toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: '2-digit' });
            document.getElementById('show-date').innerText = "ประจำวันที่ " + dateStr;
            document.getElementById('show-brix').innerText = data.val.toFixed(1);

            let status = "";
            let color = "";
            if(data.val <= 6.9) { status = "หวานน้อย (สดชื่น)"; color = "#16a34a"; }
            else if(data.val <= 7.5) { status = "หวานกลาง (กำลังดี)"; color = "#ca8a04"; }
            else if(data.val <= 8.0) { status = "หวานมาก (หอม)"; color = "#ea580c"; }
            else { status = "หวานสุด (ฉ่ำ)"; color = "#dc2626"; }
            
            const statusEl = document.getElementById('show-status');
            statusEl.innerText = status;
            statusEl.style.color = color;
        }

        // Run
        initChart();
    </script>
</body>
</html>
