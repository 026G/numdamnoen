<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หนุ่มดำเนิน - กราฟความหวาน</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 20px; color: #333; min-height: 100vh; margin: 0; }
        .container { width: 100%; max-width: 420px; }

        /* Header */
        .header { text-align: center; margin-bottom: 20px; }
        .brand-logo { width: 60px; height: 60px; border-radius: 50%; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* 1. Main Display (แสดงค่าของแท่งที่กดเลือก) */
        .display-card {
            background: white; border-radius: 20px; padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px;
            text-align: center; border: 1px solid #e2e8f0;
            transition: all 0.3s;
        }
        .selected-date { font-size: 14px; color: #888; font-weight: 400; margin-bottom: 5px; }
        .selected-brix { font-size: 48px; font-weight: 800; color: #166534; line-height: 1; }
        .selected-status { font-size: 16px; font-weight: 600; color: #16a34a; margin-top: 5px; }
        
        /* 2. Scrollable Graph Area */
        .graph-wrapper {
            width: 100%;
            overflow-x: auto; /* เลื่อนแนวนอน */
            padding-bottom: 10px;
            margin-bottom: 20px;
            /* ซ่อน Scrollbar แต่ยังเลื่อนได้ */
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }
        .graph-wrapper::-webkit-scrollbar { display: none; }

        .chart-container {
            display: flex;
            align-items: flex-end; /* แท่งกราฟชิดล่าง */
            height: 200px; /* ความสูงพื้นที่กราฟ */
            padding: 20px 10px 0 10px;
            gap: 12px; /* ระยะห่างระหว่างแท่ง */
            width: max-content; /* ขยายความกว้างตามจำนวนแท่ง */
            position: relative;
        }

        /* เส้นประบอกระดับมาตรฐาน (Reference Line) */
        .ref-line {
            position: absolute; left: 0; right: 0; 
            border-top: 1px dashed #cbd5e1; z-index: 0;
            pointer-events: none;
        }
        .ref-label {
            position: absolute; left: 10px; font-size: 10px; color: #94a3b8; background: #f8fafc; padding-right: 5px;
        }

        /* ตัวแท่งกราฟ (Bar Item) */
        .bar-group {
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            cursor: pointer; position: relative; z-index: 1;
        }
        .bar {
            width: 24px;
            border-radius: 6px 6px 4px 4px;
            transition: height 1s ease-out, transform 0.2s;
            position: relative;
        }
        /* วันที่ใต้กราฟ */
        .bar-date { font-size: 10px; color: #94a3b8; margin-top: 8px; font-weight: 300; }
        
        /* Effect ตอนกดเลือก */
        .bar-group.active .bar { transform: scale(1.1); box-shadow: 0 0 10px rgba(0,0,0,0.1); border: 2px solid rgba(0,0,0,0.2); }
        .bar-group.active .bar-date { color: #333; font-weight: 700; }

        /* สีแท่งกราฟ */
        .bg-green { background: linear-gradient(to top, #22c55e, #86efac); }
        .bg-yellow { background: linear-gradient(to top, #eab308, #fde047); }
        .bg-orange { background: linear-gradient(to top, #f97316, #fdba74); }
        .bg-red { background: linear-gradient(to top, #dc2626, #fca5a5); }

        /* ป้ายกำกับบนแท่ง (Tooltip) */
        .bar-val {
            font-size: 10px; font-weight: 700; color: #555; margin-bottom: 4px;
            opacity: 0; transition: opacity 0.2s; transform: translateY(5px);
        }
        .bar-group.active .bar-val { opacity: 1; transform: translateY(0); }

    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="https://lh3.googleusercontent.com/d/1j9sqxnSEJcCKIVZMfc20RlRP0zCU3YU8" class="brand-logo" alt="Logo">
            <h3 style="margin:5px 0; color:#166534;">สถิติความหวาน</h3>
            <div style="font-size:12px; color:#64748b;">ข้อมูลย้อนหลัง 30 วัน</div>
        </div>

        <div class="display-card">
            <div class="selected-date" id="show-date">--/--/--</div>
            <div class="selected-brix" id="show-brix">-.-</div>
            <div class="selected-status" id="show-status">...</div>
        </div>

        <div class="graph-wrapper" id="scroll-area">
            <div class="chart-container" id="chart-area">
                <div class="ref-line" style="bottom: 45%;"></div> <div class="ref-label" style="bottom: 46%;">มาตรฐาน (7.0)</div>

                </div>
        </div>

        <div style="text-align:center; font-size:11px; color:#94a3b8; margin-top:10px;">
            <i class="fa-solid fa-hand-pointer"></i> แตะที่แท่งกราฟเพื่อดูรายละเอียด
        </div>
    </div>

    <script>
        // --- Mock Data (จำลองฐานข้อมูลวันที่มีการผลิต) ---
        const db = {
            '2026-01-22': 7.5, // วันนี้
            '2026-01-20': 7.1,
            '2026-01-19': 6.8,
            '2026-01-17': 8.2,
            '2026-01-14': 7.9,
            '2026-01-10': 6.5
        };

        // แปลงวันที่เป็น Key
        const toKey = (d) => d.toISOString().split('T')[0];

        // Logic ดึงข้อมูลแบบ Fallback (ถ้าไม่มีใช้วันก่อนหน้า)
        function getDataRecursive(targetDate) {
            let d = new Date(targetDate);
            let steps = 0;
            while(steps < 10) { // ย้อนหลังได้ไม่เกิน 10 วัน
                let k = toKey(d);
                if(db[k] !== undefined) return { val: db[k], isReal: (steps===0) };
                d.setDate(d.getDate() - 1);
                steps++;
            }
            return { val: 7.0, isReal: false }; // Default
        }

        // สร้างกราฟ
        function initGraph() {
            const chartArea = document.getElementById('chart-area');
            const today = new Date(); // วันนี้ (ขวาสุด)
            const daysToShow = 30; // โชว์ย้อนหลัง 30 วัน

            // วนลูปสร้างข้อมูลย้อนหลัง (แต่เวลา Render ต้องเรียง อดีต -> ปัจจุบัน)
            let items = [];
            for(let i = 0; i < daysToShow; i++) {
                let d = new Date(today);
                d.setDate(d.getDate() - i);
                
                let data = getDataRecursive(d);
                items.push({ date: d, ...data });
            }
            items.reverse(); // กลับด้านให้ อดีตอยู่ซ้าย ปัจจุบันอยู่ขวา

            // Render HTML
            items.forEach((item, index) => {
                const isToday = (index === items.length - 1);
                
                // คำนวณความสูงแท่ง (Max 9.0 = 100%, Min 5.0 = 0%)
                // สูตรง่ายๆ: (Val / 9) * 120px
                let heightPx = (item.val / 9) * 150; 
                if(heightPx < 20) heightPx = 20; // กันเตี้ยเกิน

                // สี
                let colorClass = 'bg-green';
                let statusText = 'หวานน้อย';
                if(item.val > 6.9) { colorClass = 'bg-yellow'; statusText = 'หวานกลาง'; }
                if(item.val > 7.5) { colorClass = 'bg-orange'; statusText = 'หวานมาก'; }
                if(item.val > 8.0) { colorClass = 'bg-red'; statusText = 'หวานสุด'; }

                // วันที่
                let dateLabel = item.date.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
                if(isToday) dateLabel = "วันนี้";

                // สร้าง Element
                const el = document.createElement('div');
                el.className = `bar-group ${isToday ? 'active' : ''}`; // เลือกวันนี้เป็นค่าเริ่มต้น
                el.innerHTML = `
                    <div class="bar-val">${item.val}</div>
                    <div class="bar ${colorClass}" style="height: ${heightPx}px;"></div>
                    <div class="bar-date">${dateLabel}</div>
                `;
                
                // Event Click
                el.onclick = () => {
                    // Remove active from all
                    document.querySelectorAll('.bar-group').forEach(b => b.classList.remove('active'));
                    el.classList.add('active');
                    updateDisplay(item.date, item.val, statusText, colorClass);
                };

                chartArea.appendChild(el);

                // ถ้าเป็นวันนี้ ให้โชว์ค่าเริ่มต้นเลย
                if(isToday) {
                    updateDisplay(item.date, item.val, statusText, colorClass);
                }
            });

            // Auto Scroll ไปขวาสุด (ล่าสุด)
            setTimeout(() => {
                const scrollArea = document.getElementById('scroll-area');
                scrollArea.scrollLeft = scrollArea.scrollWidth;
            }, 100);
        }

        function updateDisplay(date, val, text, colorClass) {
            const dateStr = date.toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: '2-digit' });
            document.getElementById('show-date').innerText = "ประจำวันที่ " + dateStr;
            document.getElementById('show-brix').innerText = val;
            
            const statusEl = document.getElementById('show-status');
            statusEl.innerText = text;
            
            // เปลี่ยนสีข้อความสถานะตามแท่งกราฟ
            if(colorClass.includes('green')) statusEl.style.color = '#16a34a';
            if(colorClass.includes('yellow')) statusEl.style.color = '#ca8a04';
            if(colorClass.includes('orange')) statusEl.style.color = '#ea580c';
            if(colorClass.includes('red')) statusEl.style.color = '#dc2626';
        }

        // Run
        initGraph();

    </script>
</body>
</html>
