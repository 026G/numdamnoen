<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - ร้านหนุ่มดำเนิน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100 pb-20">

    <div class="bg-blue-600 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
        <h1 class="font-bold text-lg"><i class="fa-solid fa-store mr-2"></i>จัดการออเดอร์</h1>
        <div class="text-xs bg-blue-500 px-2 py-1 rounded" id="connection-status">🔴 Offline</div>
    </div>

    <div id="order-container" class="p-4 max-w-md mx-auto space-y-4">
        <div class="text-center text-gray-400 py-10 animate-pulse">กำลังเชื่อมต่อระบบ...</div>
    </div>

    <audio id="notif-sound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

    <script type="module">
        // ------------------------------------------------------------------
        // ⚙️ ตั้งค่า FIREBASE (ต้องตรงกับ index.html เป๊ะๆ)
        // ------------------------------------------------------------------
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // 🔴🔴🔴 วาง Config ตัวเดียวกับ index.html ตรงนี้ครับ 🔴🔴🔴
        const firebaseConfig = {
            apiKey: "AIzaSyDxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx",
            authDomain: "YOUR-APP.firebaseapp.com",
            databaseURL: "https://YOUR-APP-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "YOUR-APP",
            storageBucket: "YOUR-APP.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:xxxxxxxxxxxxxxxxx"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ฟังเสียงออเดอร์
        const audio = document.getElementById('notif-sound');
        let isFirstLoad = true;
        let lastOrderCount = 0;

        // เชื่อมต่อ Database
        const ordersRef = ref(db, 'orders');
        document.getElementById('connection-status').innerText = '🟢 Online';

        onValue(ordersRef, (snapshot) => {
            const container = document.getElementById('order-container');
            container.innerHTML = '';
            
            if (!snapshot.exists()) {
                container.innerHTML = '<div class="text-center text-gray-400 mt-10">ยังไม่มีออเดอร์</div>';
                return;
            }

            const data = snapshot.val();
            // แปลงเป็น Array แล้วเรียงจากใหม่ไปเก่า
            const orders = Object.values(data).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            // แจ้งเตือนเมื่อมีออเดอร์เพิ่ม
            if (!isFirstLoad && orders.length > lastOrderCount) {
                audio.play().catch(e => console.log('Audio Blocked'));
                const toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 3000 });
                toast.fire({ icon: 'success', title: 'มีออเดอร์ใหม่!' });
            }
            lastOrderCount = orders.length;
            isFirstLoad = false;

            orders.forEach(order => {
                const card = createOrderCard(order);
                container.innerHTML += card;
            });
        });

        // สร้างการ์ดออเดอร์ HTML
        function createOrderCard(order) {
            // กำหนดสีตามสถานะ
            let statusColor = "bg-gray-100 text-gray-600";
            if (order.status.includes("รอร้าน")) statusColor = "bg-yellow-100 text-yellow-700 border-yellow-200 animate-pulse";
            if (order.status.includes("ปรุง")) statusColor = "bg-blue-100 text-blue-700 border-blue-200";
            if (order.status.includes("ส่ง")) statusColor = "bg-purple-100 text-purple-700 border-purple-200";
            if (order.status.includes("สำเร็จ")) statusColor = "bg-green-100 text-green-700 border-green-200";

            const itemsHtml = order.items.map(i => `
                <div class="flex justify-between text-sm py-1 border-b border-dashed border-gray-200 last:border-0">
                    <span>${i.qty}x ${i.name} ${i.selectedOptions && i.selectedOptions.length > 0 ? `<span class="text-xs text-gray-400">(${i.selectedOptions.join(',')})</span>` : ''}</span>
                    <span class="font-bold text-gray-600">${i.finalPrice}</span>
                </div>
            `).join('');

            return `
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mb-4">
                <div class="p-3 flex justify-between items-start bg-gray-50 border-b border-gray-100">
                    <div>
                        <span class="font-bold text-lg text-gray-800">${order.id.slice(-4)}</span>
                        <div class="text-xs text-gray-500">${order.date}</div>
                    </div>
                    <span class="px-2 py-1 rounded text-xs font-bold border ${statusColor}">${order.status}</span>
                </div>
                
                <div class="p-3">
                    <div class="flex items-start gap-2 mb-3 bg-blue-50 p-2 rounded text-sm text-blue-800">
                        <i class="fa-solid fa-user mt-1"></i>
                        <div>
                            <div class="font-bold">${order.customer.name} (${order.customer.phone})</div>
                            <div class="text-xs mt-1 text-blue-600">${order.customer.address} ${order.customer.landmark ? `(${order.customer.landmark})` : ''}</div>
                            <div class="mt-2 flex gap-2">
                                <a href="tel:${order.customer.phone}" class="bg-white border border-blue-200 px-2 py-1 rounded text-xs hover:bg-blue-100"><i class="fa-solid fa-phone"></i> โทร</a>
                                <a href="http://maps.google.com/?q=${order.customer.location}" target="_blank" class="bg-white border border-blue-200 px-2 py-1 rounded text-xs hover:bg-blue-100"><i class="fa-solid fa-map"></i> แผนที่</a>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-1 mb-3">
                        ${itemsHtml}
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t font-bold text-lg">
                        <span>ยอดรวม</span>
                        <span class="text-blue-600">${order.total}</span>
                    </div>
                    
                    <div class="text-xs text-right mt-1 ${order.paymentMethod === 'transfer' ? 'text-green-600' : 'text-orange-500'}">
                        ${order.paymentMethod === 'transfer' ? '<i class="fa-solid fa-money-bill-transfer"></i> โอนเงินแล้ว' : '<i class="fa-solid fa-hand-holding-dollar"></i> เก็บปลายทาง'}
                    </div>
                </div>

                <div class="p-2 bg-gray-50 flex gap-2 overflow-x-auto">
                    <button onclick="window.updateStatus('${order.id}', '🍳 กำลังปรุง')" class="flex-1 bg-white border border-blue-200 text-blue-600 py-2 rounded text-xs font-bold hover:bg-blue-50 shadow-sm whitespace-nowrap">รับยอด/ปรุง</button>
                    <button onclick="window.updateStatus('${order.id}', '🛵 ไรเดอร์นำส่ง')" class="flex-1 bg-white border border-purple-200 text-purple-600 py-2 rounded text-xs font-bold hover:bg-purple-50 shadow-sm whitespace-nowrap">เรียกไรเดอร์</button>
                    <button onclick="window.updateStatus('${order.id}', '✅ สำเร็จ')" class="flex-1 bg-green-500 text-white py-2 rounded text-xs font-bold hover:bg-green-600 shadow-sm whitespace-nowrap">จบงาน</button>
                    <button onclick="window.updateStatus('${order.id}', '❌ ยกเลิก')" class="px-3 bg-red-100 text-red-500 py-2 rounded text-xs font-bold hover:bg-red-200 shadow-sm"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>
            `;
        }

        // ฟังก์ชันอัปเดตสถานะกลับไปที่ Firebase
        window.updateStatus = function(orderId, newStatus) {
            Swal.fire({
                title: 'ยืนยันเปลี่ยนสถานะ?',
                text: `${newStatus}`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'ใช่, เปลี่ยนเลย'
            }).then((result) => {
                if (result.isConfirmed) {
                    const orderRef = ref(db, 'orders');
                    // เนื่องจากเราใช้ push() ID ของ Firebase จะเป็นค่ายาวๆ (Key) 
                    // แต่ order.id ของเราเป็น ORD-xxxx 
                    // เราต้อง Query หา Key ที่ถูกต้องก่อน (เพื่อความชัวร์)
                    
                    // *เทคนิค:* เพื่อความง่าย ให้ดึงมาทั้งหมดแล้ว loop หา (ถ้าออเดอร์เยอะค่อยแก้เป็น Query)
                    onValue(ref(db, 'orders'), (snapshot) => {
                        const data = snapshot.val();
                        let firebaseKey = null;
                        for (const [key, val] of Object.entries(data)) {
                            if (val.id === orderId) { firebaseKey = key; break; }
                        }

                        if (firebaseKey) {
                            update(ref(db, `orders/${firebaseKey}`), { status: newStatus })
                            .then(() => {
                                const toast = Swal.mixin({ toast: true, position: 'top', showConfirmButton: false, timer: 1500 });
                                toast.fire({ icon: 'success', title: 'อัปเดตแล้ว' });
                            });
                        }
                    }, { onlyOnce: true });
                }
            });
        }
    </script>
</body>
</html>
